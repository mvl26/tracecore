name: Setup TraceCore bench
description: bench init theo deploy/pins.env, get-app erpnext/hrms/tracecore, tạo test_site và cài app (CI).
runs:
  using: composite
  steps:
    - name: Load pins
      shell: bash
      run: grep -E '^[A-Z_]+=' deploy/pins.env >> "$GITHUB_ENV"

    - name: System packages
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q mariadb-client libdmtx0b

    - name: Install bench
      shell: bash
      run: pip install "frappe-bench==${BENCH_VERSION}"

    - name: bench init (frappe ${{ env.FRAPPE_REF }})
      shell: bash
      run: |
        bench init --skip-redis-config-generation --skip-assets \
          --frappe-branch "$FRAPPE_REF" --python "$(which python)" ~/frappe-bench
        mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
        mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

    - name: Get apps (pinned) and tracecore from this checkout
      shell: bash
      working-directory: /home/runner/frappe-bench
      run: |
        bench get-app --branch "$ERPNEXT_REF" "$ERPNEXT_REPO"
        bench get-app --branch "$HRMS_REF" "$HRMS_REPO"
        bench get-app tracecore "$GITHUB_WORKSPACE"
        bench setup requirements --dev

    - name: Create test_site
      shell: bash
      working-directory: /home/runner/frappe-bench
      env:
        CI: "Yes"
      run: |
        bench new-site --db-root-password root --admin-password admin test_site
        bench --site test_site install-app erpnext hrms tracecore
        bench --site test_site set-config allow_tests true
        bench use test_site

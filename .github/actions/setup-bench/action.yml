name: Setup TraceCore bench
description: bench init theo deploy/pins.env, get-app erpnext/hrms/tracecore, tạo test_site và cài app (CI).
runs:
  using: composite
  steps:
    - name: Load pins
      shell: bash
      run: grep -E '^[A-Z_]+=' deploy/pins.env >> "$GITHUB_ENV"

    - name: System packages
      shell: bash
      env:
        WKHTMLTOX_URL: https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
        # SHA-256 của đúng file wkhtmltox_0.12.6.1-2.jammy_amd64.deb ở trên (17352866 byte; tính ngày 22/10/2026, GitHub không công bố hash). Trống → bước này dừng,
        # không cài gói chưa kiểm (gói cài bằng sudo).
        WKHTMLTOX_SHA256: "ee88d74834bdec650f7432c7d3ef1c981e42ae7a762a75a01f7f5da59abc18d5"
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q mariadb-client libdmtx0b
        # phiếu kiểm đếm PDF (FEAT-015 S9): wkhtmltopdf 0.12.6.1 patched qt của Frappe v15 + font có chữ Việt
        if ! [[ "$WKHTMLTOX_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::WKHTMLTOX_SHA256 is empty or not a SHA-256 hex digest: refusing to install an unchecked package ($WKHTMLTOX_URL)"
          exit 1
        fi
        curl -fsSL -o /tmp/wkhtmltox.deb "$WKHTMLTOX_URL"
        echo "$WKHTMLTOX_SHA256  /tmp/wkhtmltox.deb" | sha256sum -c -
        sudo apt-get install -y -q /tmp/wkhtmltox.deb fonts-liberation2 fonts-dejavu-core

    - name: Install bench
      shell: bash
      run: pip install "frappe-bench==${BENCH_VERSION}"

    # Cache bench đã dựng (frappe + erpnext + hrms theo pins.env, chưa có tracecore): bỏ bench init và get-app ở các lần sau.
    # Khóa theo pins.env, file action này và bản Python (venv trỏ vào Python của runner, đổi bản vá thì không dùng lại).
    - name: Cache key (bản Python)
      id: pykey
      shell: bash
      run: echo "py=$(python -c 'import sys; print(sys.version)' | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - name: Restore bench cache
      id: bench-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/frappe-bench
        key: bench-${{ runner.os }}-${{ steps.pykey.outputs.py }}-${{ hashFiles('deploy/pins.env', '.github/actions/setup-bench/action.yml') }}

    - name: bench init (frappe ${{ env.FRAPPE_REF }})
      if: steps.bench-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        bench init --skip-redis-config-generation --skip-assets \
          --frappe-branch "$FRAPPE_REF" --python "$(which python)" ~/frappe-bench

    - name: Get apps (pinned)
      if: steps.bench-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: /home/runner/frappe-bench
      run: |
        bench get-app --branch "$ERPNEXT_REF" "$ERPNEXT_REPO"
        bench get-app --branch "$HRMS_REF" "$HRMS_REPO"

    - name: Save bench cache
      if: steps.bench-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/frappe-bench
        key: ${{ steps.bench-cache.outputs.cache-primary-key }}

    - name: MariaDB charset
      shell: bash
      run: |
        mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
        mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

    - name: Get tracecore from this checkout
      shell: bash
      working-directory: /home/runner/frappe-bench
      run: |
        bench get-app tracecore "$GITHUB_WORKSPACE"
        bench setup requirements --dev

    - name: Create test_site
      shell: bash
      working-directory: /home/runner/frappe-bench
      env:
        CI: "Yes"
      run: |
        bench new-site --db-root-password root --admin-password admin test_site
        bench --site test_site install-app erpnext hrms tracecore
        bench --site test_site set-config allow_tests true
        bench use test_site

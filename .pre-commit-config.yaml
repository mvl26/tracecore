exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "tracecore.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                tracecore/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                tracecore/templates/includes/.*|
                tracecore/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                tracecore/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                tracecore/templates/includes/.*|
                tracecore/public/js/lib/.*
            )$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-q"]
        additional_dependencies: ["bandit[toml]"]
        exclude: (^|/)(tests|tests_e2e)/|(^|/)test_[^/]*\.py$

  - repo: local
    hooks:
      - id: check-architecture
        name: TraceCore architecture rules (R1-R4)
        entry: python3 scripts/check_architecture.py
        language: system
        pass_filenames: false
        types_or: [python, javascript, html, css]
      - id: check-bru-coverage
        name: BRU markers match docs/srs.md
        entry: python3 scripts/check_bru_coverage.py
        language: system
        pass_filenames: false
        types: [python]
      - id: build-tokens-check
        name: tokens.css up to date with docs/tokens.json
        entry: python3 scripts/build_tokens.py --check
        language: system
        pass_filenames: false
        files: ^(docs/tokens\.json|scripts/build_tokens\.py|tracecore/public/css/.*)$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false

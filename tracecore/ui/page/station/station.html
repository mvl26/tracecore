<div class="tc-station" data-surface="STN">
	<div class="tc-zonebar tc-zone-web" role="presentation"></div>
	<div class="tc-brand-bar"><a class="tc-brand" href="/app/tracecore">TraceCore</a></div>
	<div class="tc-offline-banner" role="status" hidden>
		{%= __("Offline - transactions are kept on this device") %}
	</div>
	<div class="tc-sync-bar" role="status" aria-live="polite" hidden></div>
	<main class="tc-main">
		<header class="tc-title">
			<h2 class="tc-station-name">{%= __("Station") %}</h2>
			<span class="tc-tag tc-zone-label"></span>
			<span class="tc-tag tc-station-code"></span>
			<button type="button" class="tc-btn tc-btn-secondary tc-help-btn" data-action="open-help">{%= __("Help") %}</button>
		</header>
		<form class="tc-auth-form tc-card tc-scan" autocomplete="off" novalidate>
			<label class="tc-sr-only" for="tc-card-input">{%= __("Scan employee card") %}</label>
			<input id="tc-card-input" class="tc-scan-input" type="text" inputmode="none"
				autocomplete="off" autocapitalize="off" spellcheck="false"
				placeholder="{%= __("Scan employee card...") %}" aria-label="{%= __("Scan employee card") %}" />
			<button type="submit" class="tc-btn tc-btn-primary">{%= __("Login") %}</button>
		</form>
		<section class="tc-auth-result" aria-live="polite"></section>
		<div class="tc-session" hidden>
			<span class="tc-session-person"></span>
			<span class="tc-session-station tc-mono"></span>
			<span class="tc-session-roles"></span>
			<span class="tc-session-expiry"></span>
			<button type="button" class="tc-btn tc-btn-secondary tc-notify-btn" data-action="toggle-notifications" aria-expanded="false" hidden>
				{%= __("Notifications") %} <span class="tc-badge tc-notify-count">0</span>
			</button>
			<button type="button" class="tc-btn tc-btn-secondary" data-action="rescan-card">{%= __("Scan another card") %}</button>
			<button type="button" class="tc-btn tc-btn-secondary" data-action="logout">{%= __("Log out") %}</button>
		</div>
		<section class="tc-notify-banner" role="alert" hidden></section>
		<section class="tc-notify-panel tc-card" aria-label="{%= __("Notifications") %}" hidden></section>
		<div class="tc-work" hidden>
		<form class="tc-card tc-scan" autocomplete="off" novalidate>
			<label class="tc-sr-only" for="tc-scan-input">{%= __("Scan Set ID") %}</label>
			<input
				id="tc-scan-input"
				class="tc-scan-input"
				type="text"
				inputmode="none"
				autocomplete="off"
				autocapitalize="off"
				spellcheck="false"
				placeholder="{%= __("Scan Set ID...") %}"
				aria-label="{%= __("Scan Set ID") %}"
			/>
			<button type="submit" class="tc-btn tc-btn-primary tc-scan-button">{%= __("Scan") %}</button>
			<button type="button" class="tc-btn tc-btn-secondary tc-pick-button" data-action="manual-pick">{%= __("Choose by hand") %}</button>
		</form>
		<section class="tc-card tc-result" aria-live="polite" data-state="loading"></section>
		</div>
	</main>
</div>

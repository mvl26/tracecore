<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceCore · Demo theo vai trò</title>
<style>
:root{--navy:#1F4E79;--blue:#2E75B6;--soft:#EBF3FB;--bg:#F4F6F9;--line:#C8D8EE;--green:#375623;--red:#C00000;--orange:#B45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203247;font:15px Arial,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.demo{background:#fff7ee;border-bottom:1px solid #e6c6a2;padding:9px 24px;display:flex;justify-content:space-between;font-size:12px;color:#854608}.shell{display:flex;min-height:calc(100vh - 35px)}aside{width:270px;flex-shrink:0;background:white;border-right:1px solid var(--line);position:sticky;top:0;height:calc(100vh - 35px);display:flex;flex-direction:column}.brand{padding:22px;border-bottom:1px solid var(--line)}.brand b{font-size:23px;letter-spacing:1px;color:var(--navy)}.brand small{display:block;color:#64748b;margin-top:5px}.admin-home{margin:14px 12px 6px;padding:12px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--navy);text-align:left;font-weight:bold}nav{overflow:auto;flex:1;padding:5px 0}nav button{width:100%;border:0;background:white;text-align:left;padding:12px 17px;border-left:4px solid transparent;color:#34475a}nav button.role{font-weight:bold;font-size:13px;display:flex;gap:9px;align-items:center}nav button.role span{font-size:11px;color:#75889b}nav button.active{background:var(--soft);border-left-color:var(--navy);color:var(--navy)}nav button.sub{padding:10px 16px 10px 53px;font-size:13px}.foot{padding:17px;border-top:1px solid var(--line);font-size:12px;color:#64748b}.avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--soft);color:var(--navy);border-radius:50%;margin-right:7px}.workspace{flex:1;min-width:0}.topbar{height:66px;background:white;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between}.context{font-size:12px;color:#64748b}.topbar button{border:1px solid var(--line);background:white;border-radius:5px;padding:7px 12px;color:var(--navy)}.zone{height:6px;background:var(--blue)}main{padding:24px 28px 50px;max-width:1750px;margin:auto}.crumb{font-size:12px;color:#627b94;margin-bottom:12px}h1{font-size:25px;color:var(--navy);margin:0}h2{font-size:16px;color:var(--navy);margin:0 0 15px}h3{font-size:14px;margin:0 0 9px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px}.muted{color:#64748b;font-size:13px;line-height:1.6}.heading p{margin:7px 0 0}.btn{border:0;border-radius:5px;background:var(--navy);color:white;padding:10px 16px;min-height:40px}.btn.secondary{border:1px solid var(--navy);background:white;color:var(--navy)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn:disabled{background:#d5dce3;color:#64748b;cursor:not-allowed}.card{background:white;border:1px solid var(--line);border-radius:7px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.role-card{background:white;border:1px solid var(--line);border-radius:7px;padding:18px;text-align:left;min-height:155px;display:flex;flex-direction:column;align-items:flex-start;color:inherit}.role-card:hover{border-color:var(--blue);background:#fafdff}.role-card strong{display:block;margin:9px 0 6px;color:var(--navy);font-size:16px}.role-card .link{margin-top:auto;padding-top:12px;font-size:12px;color:var(--blue)}.pill{display:inline-block;border-radius:4px;background:var(--soft);color:var(--navy);padding:4px 8px;font-size:11px;font-weight:bold}.pill.green{background:#F2F7EE;color:var(--green)}.pill.warn{background:#FFF7EE;color:var(--orange)}.pill.red{background:#FFF2F2;color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.kpi{border:1px solid var(--line);border-left:4px solid var(--blue);background:white;border-radius:6px;padding:16px}.kpi b{display:block;font-size:28px;color:var(--navy);margin-bottom:6px}.kpi small{font-size:12px;color:#64748b}.alert{display:flex;align-items:center;justify-content:space-between;gap:15px;border-left:4px solid var(--red);background:#FFF2F2;padding:13px 15px;margin:10px 0;line-height:1.5;font-size:13px}.alert.warn{border-color:var(--orange);background:#FFF7EE}.alert.info{border-color:var(--blue);background:var(--soft)}.alert.ok{border-color:var(--green);background:#F2F7EE}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:var(--navy);color:white;font-weight:normal;padding:12px}td{padding:13px 11px;border-bottom:1px solid #e2e8f0}tr:nth-child(even) td{background:#f8fafc}code{font-family:'Courier New',monospace;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{border:1px solid var(--line);background:white;border-radius:5px;padding:10px 17px;color:var(--navy)}.tabs button.on{background:var(--navy);color:white}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 20px}.flow button{background:white;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:6px;text-align:left;padding:16px;color:var(--navy)}.flow b{display:block;font-size:26px;margin:12px 0 5px}.scan{background:var(--soft);padding:12px;display:flex;gap:10px;border:1px dashed var(--navy);border-radius:6px;margin-bottom:15px}.scan input{flex:1;min-width:0;padding:12px;border:1px solid #90aac4;border-radius:4px;font-family:'Courier New',monospace}.gate{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.gate span{padding:8px 12px;border:1px solid var(--line);border-radius:5px;font-size:12px}.gate .done{background:#F2F7EE;color:var(--green);border-color:#9aae91}.tray{height:255px;background:#f3f6f9;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#64748b;gap:13px}.tray svg{width:230px;height:120px}.check{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:5px;padding:14px;margin-bottom:10px;font-size:13px}.check input{width:22px;height:22px;accent-color:var(--green)}.check label{flex:1}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.tasks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.tasks button{background:white;border:1px solid var(--line);border-radius:6px;color:var(--navy);padding:22px 12px;text-align:left;font-weight:bold;min-height:100px}.tasks small{display:block;font-weight:normal;color:#64748b;margin-top:10px}dialog{border:1px solid var(--line);border-radius:9px;padding:26px;max-width:470px;width:90%;color:#203247}dialog::backdrop{background:#152d4666}dialog input{width:100%;padding:11px;border:1px solid var(--line);border-radius:4px;margin:8px 0 15px}#toast{position:fixed;bottom:25px;right:25px;background:var(--navy);color:white;padding:14px 20px;border-radius:6px;display:none;z-index:99}.empty{padding:35px;text-align:center;color:#64748b}.small-button{padding:6px 10px;font-size:12px;min-height:30px}.filters{display:flex;gap:10px;margin-bottom:15px}.filters input,.filters select{padding:9px;border:1px solid var(--line);border-radius:4px;background:white}.filters input{flex:1}@media(max-width:1100px){aside{width:230px}.roles{grid-template-columns:repeat(2,1fr)}main{padding:20px}.grid{grid-template-columns:1fr}.tasks{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="demo"><span>DEMO THIẾT KẾ · Dữ liệu minh họa · Chưa kết nối hệ thống</span><span>Bấm menu và các nút để khám phá</span></div>
<div class="shell"><aside><div class="brand"><b>TRACECORE</b><small>Quản lý vận hành KSNK</small></div><button class="admin-home" onclick="go('admin')">▦ &nbsp; Admin tổng</button><nav id="nav"></nav><div class="foot"><span class="avatar">AD</span><b>Quản trị viên</b><div style="margin-top:9px">Đang xem các không gian theo role</div></div></aside><div class="workspace"><header class="topbar"><div><b id="context">Trung tâm quản trị</b><div class="context">Bệnh viện · Khoa Kiểm soát nhiễm khuẩn</div></div><div><button onclick="go('admin')">Về Admin tổng</button> &nbsp; <button onclick="notice('Demo: Trung tâm thông báo sẽ tổng hợp việc chờ theo quyền.')">Thông báo · 7</button></div></header><div class="zone" id="zone"></div><main id="view"></main></div></div>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status"></div>
<script>
const roles=[['R01','Trưởng khoa KSNK','Phê duyệt, theo dõi và báo cáo',['Tổng quan hôm nay','Ghi đè cơ số','Thu hồi & sự cố','Giá thành tái xử lý','Thiết bị & test ngày','Nhân sự & chứng chỉ','Sổ tiệt khuẩn điện tử']],['R02','Giám sát CSSD','Điều phối ca và xử lý ngoại lệ',['Bảng điều phối ca','Chờ giải phóng mẻ','Danh mục dụng cụ & bộ','Năng lực & phân ca','NC / CAPA']],['R03','KTV khu bẩn','Tiếp nhận và rửa–khử khuẩn',['T1 · Tiếp nhận','T2 · Rửa–khử khuẩn']],['R04','KTV khu sạch','Kiểm tra, lắp ráp và đóng gói',['T3 · Kiểm tra–lắp ráp','T4 · Đóng gói']],['R05','KTV tiệt khuẩn','Test ngày, vận hành và dỡ mẻ',['Máy & mẻ hôm nay','Test hằng ngày','T5 · Nạp mẻ','T5b · Dỡ mẻ & kết quả']],['R06','Kho vô khuẩn / cấp phát','Vị trí, FEFO và cấp phát cho khoa',['T6 · Nhập kho','Tồn kho vô khuẩn','T7 · Cấp phát']],['R07','Đồ vải & chất thải','Thu gom, xử lý và bàn giao',['Đồ vải','Chất thải y tế']],['R08','Khoa sử dụng','Nhận, sử dụng và trả dụng cụ',['Bộ tại khoa & cơ số','Quét sử dụng','Gửi trả đồ bẩn','Đề nghị cấp','Xác nhận thu hồi','Tra cứu gói']],['R09','Kế toán / Vật tư','Vật tư, chi phí và giá thành',['Tổng quan vật tư & chi phí','Nhập kho theo lô','Chi phí & bảng giá','Giá thành']],['R10','Quản trị hệ thống','Cấu hình, phân quyền và audit',['Tình trạng hệ thống','Khu & trạm','Tài khoản & quyền','Mẫu nhãn','Audit trail']]];
let state={role:'admin',page:0,checked:0};const $=id=>document.getElementById(id);const pill=(s,c='')=>`<span class="pill ${c}">${s}</span>`;const btn=(s,fn,c='')=>`<button class="btn ${c}" onclick="${fn}">${s}</button>`;
function notice(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',4000)}
function go(role,page=0){state={role,page,checked:0};render();window.scrollTo(0,0)}
function heading(title,desc,action=''){return `<div class="heading"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${action}</div>`}
function kpis(items){return `<div class="kpis">${items.map(([n,l])=>`<div class="kpi"><b>${n}</b><small>${l}</small></div>`).join('')}</div>`}
function table(head,rows){return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function modal(title,body){$('modal-content').innerHTML=`<h2>${title}</h2>${body}<div class="actions">${btn('Đóng',"$('modal').close()",'secondary')}</div>`;$('modal').showModal()}
function sample(title){modal(title,`<p class="muted">Đây là tương tác minh họa. Không ghi dữ liệu hoặc thực hiện phê duyệt thật.</p>`)}
function render(){const r=roles.find(x=>x[0]===state.role);$('nav').innerHTML=roles.map(x=>`<button class="role ${x[0]===state.role?'active':''}" onclick="go('${x[0]}')"><span>${x[0]}</span>${x[1]}</button>${x[0]===state.role?x[3].map((p,i)=>`<button class="sub ${i===state.page?'active':''}" onclick="go('${x[0]}',${i})">${p}</button>`).join(''):''}`).join('');$('context').textContent=r?'Đang xem: '+r[1]:'Trung tâm quản trị';$('zone').style.background=state.role==='R03'?'var(--red)':['R04','R05'].includes(state.role)?'#E36C09':state.role==='R06'?'var(--green)':'var(--blue)';$('view').innerHTML=`<div class="crumb">Admin tổng ${r?' / '+r[0]+' · '+r[1]+' / '+r[3][state.page]:''}</div>`+(state.role==='admin'?admin():state.role==='R01'?leader():state.role==='R02'?supervisor():state.role==='R04'?clean():state.role==='R08'?dept():overview(r));}
function admin(){return heading('Một hệ thống. Mười không gian làm việc.','Chọn vai trò để mở dashboard và các chức năng tương ứng. Danh tính đang đăng nhập vẫn là Quản trị viên.')+kpis([['10','Vai trò nghiệp vụ'],['7','Việc cần chú ý · minh họa'],['8','Trạm trong chuỗi xử lý'],['3','Khu một chiều']])+`<div class="roles">${roles.map(x=>`<button class="role-card" onclick="go('${x[0]}')">${pill(x[0])}<strong>${x[1]}</strong><span class="muted">${x[2]}</span><span class="link">Mở không gian →</span></button>`).join('')}</div>`;}
function leader(){if(state.page===1)return heading('Ghi đè cơ số tái xử lý','Xem đề nghị và quyết định trong phạm vi được cấp quyền.')+card('Đề nghị chờ duyệt',table(['Đề nghị / Bộ','Chu trình','Lý do','Xin thêm','Hành động'],[['<code>GD-2026-014</code><br>Bộ tiểu phẫu TE01-021','200 / 200','Chờ bộ thay thế, ca mổ cấp cứu','5 chu trình',btn('Xem đề nghị',"approval()")]]));if(state.page===2)return heading('Thu hồi & sự cố','Theo dõi tới từng gói và khoa nhận.')+card('TH-2026-003 · Đang thu hồi',table(['Cycle ID','Khoa / vị trí','Trạng thái','Xác nhận'],[['<code>CY-260915-0032</code>','Phòng mổ','Đã cấp phát',pill('Chờ khoa','warn')],['<code>CY-260915-0033</code>','Phòng mổ','Đã sử dụng · BN09****78',pill('Chờ khoa','warn')],['<code>CY-260915-0034</code>','Ngoại tổng hợp','Đã cấp phát',pill('Đã xác nhận','green')]]));if(state.page>2)return overview(roles[0]);return heading('Tổng quan hôm nay','Trưởng khoa KSNK · Ưu tiên các quyết định đang chờ',pill('R01 · Không gian quản lý'))+card('Cần quyết định của Trưởng khoa',`<div class="alert"><div><b>Đề nghị ghi đè cơ số · TE01-021</b><br>Xin thêm 5 chu trình · chờ bộ thay thế</div>${btn('Xem và duyệt',"go('R01',1)")}</div><div class="alert"><div><b>Thu hồi TH-2026-003 đang mở</b><br>2 / 4 gói chưa được khoa xác nhận</div>${btn('Theo dõi',"go('R01',2)",'red')}</div><div class="alert warn"><div><b>Máy MH-02 đang khóa</b> · chưa có test ngày</div>${pill('Cần kiểm tra','warn')}</div><div class="alert warn"><div>2 chứng chỉ sắp hết hạn trong 30 ngày</div>${btn('Xem nhân sự',"go('R01',5)",'secondary small-button')}</div>`)+kpis([['144','Bộ đang tái xử lý'],['11','Mẻ hôm nay'],['26','Gói sắp hết hạn'],['3','Sự cố / NC đang mở']])+`<div class="grid">${card('Sản lượng theo trạm',table(['Trạm','Số bộ / gói','TB phút / bộ'],[['T1 · Tiếp nhận','156','0,8'],['T3 · Lắp ráp','142','9,5'],['T5 · Tiệt khuẩn','11 mẻ / 138 gói','—']]))}${card('Tồn tại khoa so với cơ số',table(['Khoa','Tồn','Cơ số','Tình trạng'],[['Phòng mổ','8','6–10',pill('Đạt','green')],['Ngoại tổng hợp','3','4–8',pill('Dưới tối thiểu','warn')],['Cấp cứu','1','2–4',pill('Dưới tối thiểu','warn')]]))}</div>`}
function approval(){modal('Đề nghị GD-2026-014',`<p>Bộ TE01-021 · 200/200 chu trình</p><p class="muted">Người đề nghị: Trần Văn Hùng<br>Lý do: chờ bộ thay thế, ca mổ cấp cứu.</p><label>Ý kiến quyết định</label><input placeholder="Nhập lý do…"><p class="muted">Thao tác thật sẽ yêu cầu quyền phê duyệt và xác thực theo nghiệp vụ.</p>${btn('Minh họa duyệt',"$('modal').close();notice('Demo: Đã minh họa duyệt. Không có dữ liệu thật được ghi.')",'green')}`)}
function supervisor(){if(state.page>0)return overview(roles[1]);return heading('Bảng điều phối ca','Ca sáng · Theo dõi điểm nghẽn và phối hợp giữa các khu.',btn('Xem phân ca',"go('R02',3)",'secondary'))+`<div class="flow">${[['T1 · Tiếp nhận','12','Chờ nhận'],['T2 · Rửa','3','Lô đang chạy'],['T3 · Lắp ráp','18','Bộ đang chờ'],['T4 · Đóng gói','9','Bộ đang chờ'],['T5 · Tiệt khuẩn','2','Mẻ chờ duyệt']].map(([t,n,l],i)=>`<button onclick="${i===3?"go('R04',1)":i===4?"go('R02',1)":"sample('Chi tiết hàng đợi '+ '"+t+"')"}">${t}<b>${n}</b><span class="muted">${l}</span></button>`).join('')}</div>`+card('Ưu tiên trong ca',table(['Mức','Công việc','Vị trí','Chờ','Hành động'],[[pill('Cần duyệt','red'),'Mẻ ME-260920-03 đủ kết quả, chờ giải phóng','T5b','18 phút',btn('Mở mẻ',"go('R02',1)",'small-button')],[pill('Cần xác nhận','warn'),'Thiếu 1 kẹp Kocher · DB01-012','T3','12 phút',btn('Xem bộ',"go('R04')",'secondary small-button')],[pill('Cần điều phối','warn'),'Hàng đợi lắp ráp tăng · 18 bộ','Khu sạch','—',btn('Xem phân ca',"go('R02',3)",'secondary small-button')]]))+card('Trạng thái nguồn lực',table(['Khu','Nhân sự trong ca','Thiết bị','Tình trạng'],[['Khu bẩn','3 KTV','MR-01 đang chạy',pill('Đang vận hành','green')],['Khu sạch','4 KTV','2 bàn lắp ráp · 1 bàn đóng gói',pill('Hàng đợi tăng','warn')],['Khu vô khuẩn','2 KTV','MH-01 sẵn sàng',pill('Đang vận hành','green')]]));}
function clean(){const packing=state.page===1;return heading(packing?'T4 · Đóng gói':'T3 · Kiểm tra–lắp ráp','KTV khu sạch · Bộ DB01-015 · Bộ mổ đại phẫu bụng',pill('Khu sạch','warn'))+`<div class="tabs"><button class="${!packing?'on':''}" onclick="go('R04')">T3 · Lắp ráp</button><button class="${packing?'on':''}" onclick="go('R04',1)">T4 · Đóng gói</button></div><div class="scan"><input aria-label="Quét Set ID" placeholder="Quét Set ID…" value="DB01-015">${btn('Quét bộ',"notice('Demo: Đã mở bộ DB01-015.')")}</div>`+card('DB01-015 · BOM v1 · 18 dụng cụ',`<div class="gate"><span class="done">T1 · Đạt</span><span class="done">T2 · Đạt</span><span class="${packing?'done':''}">T3 · ${packing?'Đạt':'Đang kiểm'}</span><span>T4 · ${packing?'Đang đóng gói':'Chưa'}</span><span>T5 · Chưa</span></div><div class="alert ${packing?'warn':'ok'}">${packing?'Kẹp Kocher đến hạn tra dầu. Xác nhận bảo dưỡng trước khi hoàn tất.':'Tiếp nhận xác nhận đủ thành phần. Đối chiếu ảnh và kiểm tra sau rửa.'}</div><div class="grid"><div><div class="tray"><svg viewBox="0 0 240 130" fill="none" aria-label="Vị trí ảnh bộ minh họa"><rect x="8" y="8" width="224" height="114" rx="8" stroke="#8fa5b8" stroke-width="2"/><path d="M40 30v66m10-66v66m28-66v66m10-66v66m35-66v66m10-66v66m32-66v66m10-66v66" stroke="#9eb1c2" stroke-width="5"/><circle cx="45" cy="96" r="10" stroke="#647e94"/><circle cx="83" cy="96" r="10" stroke="#647e94"/><circle cx="128" cy="96" r="10" stroke="#647e94"/><circle cx="170" cy="96" r="10" stroke="#647e94"/></svg><b>Vùng ảnh bộ thực tế</b><small>Hình sơ đồ chỉ minh họa vị trí ảnh trong demo</small></div><p class="muted">Ảnh chuẩn của bộ · Góc chụp 1 / 3<br>Chu trình: 47 / 300 · Chưa đến ngưỡng cơ số</p></div><div>${[['Kẹp Kocher 16 cm','6'],['Kéo Metzenbaum 18 cm','2'],['Kìm kẹp kim Mayo-Hegar','2'],['Cán dao số 4','2'],['Banh Farabeuf','2'],['Kẹp Allis','4']].map(([n,q],i)=>`<div class="check"><input type="checkbox" id="c${i}" onchange="updateChecks()"><label for="c${i}"><b>${n}</b><br><span class="muted">${packing?'Đã đặt đúng vị trí':'Đủ, sạch, hoạt động tốt'}</span></label><code>× ${q}</code></div>`).join('')}</div></div>${packing?'<div class="scan"><input aria-label="Lô chỉ thị" placeholder="Quét lô chỉ thị hóa học…"><button class="btn" onclick="notice(\'Demo: Lô CI5-2609 được minh họa hợp lệ.\')">Quét chỉ thị</button></div>':''}<div class="actions"><span class="muted" id="count">Đã xác nhận 0 / 6 loại</span><div>${btn('Xác nhận tất cả',"document.querySelectorAll('.check input').forEach(x=>x.checked=true);updateChecks()",'secondary')} ${btn(packing?'Xem trước nhãn':'Xác nhận → Đóng gói',packing?"labelPreview()":"go('R04',1)",'green')}</div></div><p class="muted">Demo cho phép khám phá các bước; bản thật kiểm tra đầy đủ điều kiện nghiệp vụ.</p>`)}
function updateChecks(){state.checked=document.querySelectorAll('.check input:checked').length;$('count').textContent='Đã xác nhận '+state.checked+' / 6 loại'}
function labelPreview(){modal('Xem trước nhãn · Minh họa',`<div style="border:1px solid #203247;padding:18px"><code><b>CY-260920-0013</b></code><p>Bộ mổ đại phẫu bụng · DB01-015</p><p class="muted">Hấp · Giấy crepe · BOM v1<br>Người đóng gói: Trần Văn Hùng<br>Chỉ thị: CI5-2609</p><b>Hạn dùng: 20/10/2026</b></div><p class="muted">Chưa sinh mã hoặc gửi lệnh in thật.</p>`)}
function dept(){if(state.page===1)return heading('Quét sử dụng cho bệnh nhân','Phòng mổ · Kiểm tra gói trước khi sử dụng.')+card('Quét Cycle ID',`<div class="scan"><input id="cycle" placeholder="Quét Cycle ID trên gói…">${btn('Kiểm tra',"usePack()")}</div><div id="use-result" class="empty">Chưa quét gói. Thông tin bộ và biểu mẫu sẽ xuất hiện tại đây.</div>`);if(state.page===2)return heading('Gửi trả đồ bẩn','Phòng mổ · Yêu cầu lấy đồ bẩn; tiếp nhận thực tế tại T1.')+card('Chọn bộ gửi trả',table(['Chọn','Set ID','Loại bộ','Tình trạng'],[['<input type="checkbox" checked>','DB01-007','Bộ mổ đại phẫu bụng','Đã sử dụng'],['<input type="checkbox">','TE01-030','Bộ tiểu phẫu','Tại khoa']])+`<div class="actions"><span class="muted">Ghi chú bất thường khi có</span>${btn('Gửi yêu cầu',"notice('Demo: Đã minh họa yêu cầu trả đồ bẩn.')")}</div>`);if(state.page===4)return heading('Xác nhận thu hồi','Phòng mổ · TH-2026-003')+`<div class="alert">Ngừng sử dụng các gói trong lệnh thu hồi. Kiểm tra và ghi nhận tình trạng.</div>`+card('Gói cần xác nhận',table(['Cycle ID','Trạng thái','Hành động'],[['CY-260915-0032','Đã cấp phát',btn('Xác nhận tình trạng',"sample('Xác nhận gói thu hồi')")],['CY-260915-0033','Đã sử dụng · BN09****78',btn('Ghi nhận đã thông báo',"sample('Ghi nhận thông báo')",'secondary')]]));if(state.page>0)return overview(roles[7]);return heading('Phòng mổ · Bộ dụng cụ tại khoa','Cổng khoa sử dụng · Chỉ dữ liệu thuộc phạm vi được phép.')+`<div class="tasks">${[['Quét sử dụng','Gắn gói với ca sử dụng',1],['Trả đồ bẩn','Gửi yêu cầu về KSNK',2],['Đề nghị cấp','Bổ sung bộ cho khoa',3],['Xác nhận thu hồi','2 gói cần kiểm tra',4]].map(([t,d,p])=>`<button onclick="go('R08',${p})">${t}<small>${d} →</small></button>`).join('')}</div>`+kpis([['8','Bộ đang tại khoa'],['6–10','Cơ số được cấu hình'],['3','Bộ đang tái xử lý'],['2','Gói cần xác nhận thu hồi']])+card('Bộ đang tại khoa',table(['Set ID','Loại bộ','Cycle ID','Hạn dùng','Trạng thái'],[['DB01-007','Bộ mổ đại phẫu bụng','CY-260919-0041','19/10/2026',pill('Đã cấp phát','green')],['DB01-012','Bộ mổ đại phẫu bụng','CY-260919-0044','19/10/2026',pill('Đã cấp phát','green')],['TE01-030','Bộ tiểu phẫu','CY-260918-0007','17/03/2027',pill('Đã cấp phát','green')]]));}
function usePack(){$('use-result').className='';$('use-result').innerHTML=`<div class="alert ok">Gói mẫu hợp lệ · Bộ mổ đại phẫu bụng · Hạn 19/10/2026</div><div class="filters"><input aria-label="Mã bệnh nhân" placeholder="Mã bệnh nhân"><input aria-label="Mã ca mổ" placeholder="Mã ca mổ"></div>${btn('Xác nhận sử dụng',"notice('Demo: Đã minh họa xác nhận sử dụng. Không lưu thông tin bệnh nhân.')",'green')}`}
function overview(r){const title=r[3][state.page];const configs={R03:[['12','Bộ chờ tiếp nhận'],['3','Lô rửa đang chạy'],['1','Lô chờ dỡ'],['0','Lỗi đang chặn']],R05:[['2','Máy sẵn sàng'],['1','Máy đang khóa'],['3','Mẻ đang chạy'],['2','Mẻ chờ kết quả']],R06:[['742','Gói trong kho'],['26','Hết hạn trong 7 ngày'],['8','Phiếu chờ cấp'],['12','Gói chờ nhập']],R07:[['6','Lượt thu gom'],['124','Kg đồ vải'],['3','Lượt chất thải'],['1','Lượt chờ bàn giao']],R09:[['4','Chứng từ chờ xử lý'],['7','Vật tư dưới tồn tối thiểu'],['3','Lô sắp hết hạn'],['2','Khoản chi thiếu dữ liệu']],R10:[['7','Trạm trực tuyến'],['1','Trạm mất kết nối'],['2','Lệnh in lỗi'],['0','Cảnh báo quyền']]};return heading(title,r[0]+' · '+r[2],pill('Màn minh họa cấu trúc'))+(configs[r[0]]?kpis(configs[r[0]]):'')+card('Danh sách công việc',`<div class="filters"><input aria-label="Tìm kiếm" placeholder="Tìm theo mã hoặc tên…" oninput="filterRows(this.value)"><select aria-label="Trạng thái"><option>Tất cả trạng thái</option><option>Chờ xử lý</option><option>Hoàn tất</option></select></div>`+table(['Tham chiếu','Nội dung','Trạng thái','Hành động'],[['<code>DEMO-001</code>',title+' · hồ sơ minh họa 1',pill('Chờ xử lý','warn'),btn('Xem chi tiết',"sample('Chi tiết hồ sơ DEMO-001')",'small-button')],['<code>DEMO-002</code>',title+' · hồ sơ minh họa 2',pill('Đang xử lý'),btn('Xem chi tiết',"sample('Chi tiết hồ sơ DEMO-002')",'secondary small-button')]]))+`<p class="muted">Màn này minh họa cấu trúc điều hướng và mật độ bảng. Chi tiết trường và luồng sẽ được dựng theo SCR tương ứng sau khi chốt bố cục.</p>`}
function filterRows(q){document.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q.toLowerCase()))}
render();
</script></body></html>
